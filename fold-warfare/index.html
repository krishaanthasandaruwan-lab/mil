<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05080c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="assets/icon_trophy.png" />
    <title>Fold Warfare</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      /* iPhone Duo screens are wider than the game's 9:16 frame: the side margins continue the battlefield. */
      body { background: #05080c; background-image: linear-gradient(rgba(5, 8, 12, 0.8), rgba(5, 8, 12, 0.8)), url(assets/env_ground_tile.png); background-size: auto, 420px; }
      /* Keep the game clear of the camera housing and home indicator on both iPhone Duo screens.
         The cover screen reports its corner camera as a side inset; in portrait that only matters at the top,
         so the game drops below it and stays centred instead of being squeezed sideways. */
      #game { position: fixed; left: 0; right: 0; bottom: env(safe-area-inset-bottom); top: max(env(safe-area-inset-top), env(safe-area-inset-left), env(safe-area-inset-right)); }
      /* Folded iPhone Duo battle: the playground fills the whole outer screen. */
      body.fullbleed #game { top: 0; bottom: 0; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
